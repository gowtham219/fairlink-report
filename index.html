<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fairlink Service Reports</title>
<style>
:root{--bg:#f4f5fa;--c:#fff;--t:#1d1f33;--m:#6b6f8a;--p:#2e3192;--o:#f7941d;--b:#dfe1ee;--r:#e81c24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12131c;--c:#1c1e2e;--t:#eceefb;--m:#9a9eb8;--p:#8a8df0;--b:#31344d}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:72px}
header{background:var(--c);border-bottom:3px solid var(--o);padding:8px 14px;display:flex;align-items:center;gap:10px}header img{height:38px;background:#fff;border-radius:4px}header b{color:var(--p)}
main{max-width:760px;margin:auto;padding:12px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:12px 2px;font-size:12px}nav button.on{color:var(--p);font-weight:700}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}textarea{min-height:70px}
button.b{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600}button.s{background:var(--bg);color:var(--t);border:1px solid var(--b)}button.d{background:var(--r)}
h2{font-size:18px;margin:6px 0 10px}.m{color:var(--m);font-size:13px}.tag{background:var(--o);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;text-align:center}.stats b{font-size:24px;color:var(--p);display:block}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph img{width:84px;height:84px;object-fit:cover;border-radius:6px}
.lh{text-align:center;border-bottom:3px solid var(--o);padding-bottom:8px;margin-bottom:10px}.lh img{max-width:260px;background:#fff}table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid var(--b);vertical-align:top}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:0}}
</style></head><body>

const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
async function load(){try{idb=await new Promise((ok,no)=>{const q=indexedDB.open('fairlink',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=no});
const v=await new Promise(ok=>{const g=idb.transaction('k').objectStore('k').get('db');g.onsuccess=()=>ok(g.result);g.onerror=()=>ok(null)});if(v)DB=v}catch(e){try{DB=JSON.parse(localStorage.getItem('db'))||DB}catch(_){}}go({p:'home'})}
function save(){try{if(idb)idb.transaction('k','readwrite').objectStore('k').put(DB,'db');else localStorage.setItem('db',JSON.stringify(DB))}catch(e){alert('Could not save: '+e.message)}}
const cust=id=>DB.customers.find(c=>c.id==id)||{},mach=id=>DB.machines.find(m=>m.id==id)||{};
const mname=m=>[m.brand,m.model].filter(Boolean).join(' ')+(m.serial?' (SN '+m.serial+')':'');
function go(v){V=v;window.scrollTo(0,0);render()}
function render(){const t=[['home','Home'],['customers','Customers'],['reports','Reports'],['settings','Settings']];
$('#nav').innerHTML=t.map(([k,l])=>`<button class="${V.p.startsWith(k)||(k=='reports'&&V.p=='report')?'on':''}" onclick="go({p:'${k}'})">${l}</button>`).join('');
$('#app').innerHTML=({home,customers,customer,reports,report,form,settings})[V.p]()}
function home(){const rs=DB.reports.slice().sort((a,b)=>b.date.localeCompare(a.date));
return `<div class="stats"><div><b>${DB.customers.length}</b>Customers</div><div><b>${DB.machines.length}</b>Machines</div><div><b>${DB.reports.length}</b>Reports</div></div>
<p><button class="b" onclick="newReport()">+ New service report</button></p><h2>Recent reports</h2>${rs.slice(0,6).map(rcard).join('')||'<p class="m">No reports yet.</p>'}`}
function rcard(r){return `<div class="card" onclick="go({p:'report',id:'${r.id}'})"><b>${h(r.no)}</b> <span class="tag">${h(r.status)}</span><div>${h(cust(r.cid).name)}</div><div class="m">${h(r.date)} · ${r.items.length} machine(s)</div></div>`}
function reports(){const q=(V.q||'').toLowerCase(),rs=DB.reports.filter(r=>(r.no+cust(r.cid).name).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
return `<h2>Reports</h2><input placeholder="Search" value="${h(V.q||'')}" oninput="V.q=this.value;$('#list').innerHTML=''; V.p='reports';render();$('input').focus()"><p><button class="b" onclick="newReport()">+ New report</button></p><div id="list">${rs.map(rcard).join('')||'<p class="m">Nothing found.</p>'}</div>`}
function customers(){return `<h2>Customers</h2><p><button class="b" onclick="go({p:'customer',id:''})">+ Add customer</button></p>${DB.customers.map(c=>`<div class="card" onclick="go({p:'customer',id:'${c.id}'})"><b>${h(c.name)}</b><div class="m">${h(c.location)} · ${DB.machines.filter(m=>m.cid==c.id).length} machine(s)</div></div>`).join('')||'<p class="m">No customers yet.</p>'}`}
function customer(){const c=V.id?cust(V.id):{},ms=DB.machines.filter(m=>m.cid==V.id);
return `<h2>${c.id?'Customer':'New customer'}</h2><div class="card"><label>Name</label><input id="cn" value="${h(c.name)}"><label>Location</label><input id="cl" value="${h(c.location)}"><label>Contact person</label><input id="cp" value="${h(c.contact)}"><label>Mobile</label><input id="cm" type="tel" value="${h(c.mobile)}"><label>Email</label><input id="ce" value="${h(c.email)}"><label>Notes</label><textarea id="co">${h(c.notes)}</textarea>
<p><button class="b" onclick="saveCust()">Save</button> <button class="b s" onclick="go({p:'customers'})">Back</button> ${c.id?`<button class="b d" onclick="delCust()">Delete</button>`:''}</p></div>
${c.id?`<h2>Machines</h2>${ms.map(m=>`<div class="card"><b>${h(mname(m))}</b><div class="m">${h(m.notes)}</div><button class="b s" onclick="delMach('${m.id}')">Remove</button></div>`).join('')}
<div class="card"><div class="row"><div><label>Brand</label><input id="mb"></div><div><label>Model</label><input id="mm"></div><div><label>Serial no.</label><input id="ms"></div></div><label>Notes</label><input id="mo"><p><button class="b" onclick="addMach()">+ Add machine</button></p></div>`:'<p class="m">Save the customer first, then add machines.</p>'}`}
function saveCust(){const n=$('#cn').value.trim();if(!n)return alert('Name is required');if(DB.customers.some(c=>c.name.toLowerCase()==n.toLowerCase()&&c.id!=V.id))return alert('Customer already exists');
const o={id:V.id||uid(),name:n,location:$('#cl').value,contact:$('#cp').value,mobile:$('#cm').value,email:$('#ce').value,notes:$('#co').value};
const i=DB.customers.findIndex(c=>c.id==o.id);i<0?DB.customers.push(o):DB.customers[i]=o;save();go({p:'customer',id:o.id})}
function delCust(){if(DB.reports.some(r=>r.cid==V.id))return alert('This customer has reports and cannot be deleted.');if(!confirm('Delete customer and machines?'))return;DB.machines=DB.machines.filter(m=>m.cid!=V.id);DB.customers=DB.customers.filter(c=>c.id!=V.id);save();go({p:'customers'})}
function addMach(){const m={id:uid(),cid:V.id,brand:$('#mb').value,model:$('#mm').value,serial:$('#ms').value,notes:$('#mo').value};if(!m.brand&&!m.model)return alert('Enter brand or model');DB.machines.push(m);save();render()}
function delMach(id){if(DB.reports.some(r=>r.items.some(i=>i.mid==id)))return alert('Used in a report; cannot remove.');DB.machines=DB.machines.filter(m=>m.id!=id);save();render()}
async function dl(n,data,t){try{const d=window.claude&&await claude.use('downloads');if(d)return d.save({filename:n,data})}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function newReport(){if(!DB.customers.length){alert('Add a customer first.');return go({p:'customers'})}
R={id:uid(),no:'',cid:'',loc:'',contact:'',mobile:'',date:today(),hours:'',s1:'',s2:'',s3:'',tech:DB.set.tech,mgr:DB.set.mgr,sign:'',status:'Completed',items:[]};go({p:'form'})}
function editReport(id){R=JSON.parse(JSON.stringify(DB.reports.find(r=>r.id==id)));go({p:'form'})}
const F=(k,l,t='text')=>`<label>${l}</label><input type="${t}" value="${h(R[k])}" oninput="R.${k}=this.value">`;
function form(){const ms=DB.machines.filter(m=>m.cid==R.cid);
return `<h2>${R.no||'New report'}</h2><div class="card"><label>Customer</label><select onchange="pick(this.value)"><option value="">Select…</option>${DB.customers.map(c=>`<option value="${c.id}" ${c.id==R.cid?'selected':''}>${h(c.name)}</option>`).join('')}</select>${F('loc','Location')}<div class="row"><div>${F('contact','Contact person')}</div><div>${F('mobile','Mobile','tel')}</div></div><div class="row"><div>${F('date','Visit date','date')}</div><div>${F('hours','Running hours')}</div></div></div>
<h2>Machines serviced</h2>${R.items.map((it,i)=>`<div class="card"><b>${h(mname(mach(it.mid)))}</b><div class="row"><div><label>Status</label><select onchange="R.items[${i}].status=this.value">${['Working','Repaired','Needs parts','Pending'].map(s=>`<option ${s==it.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Time in</label><input type="time" value="${it.tin}" oninput="R.items[${i}].tin=this.value"></div><div><label>Time out</label><input type="time" value="${it.tout}" oninput="R.items[${i}].tout=this.value"></div></div>
<label>Work description</label><textarea oninput="R.items[${i}].desc=this.value">${h(it.desc)}</textarea><div class="ph">${it.imgs.map((s,j)=>`<img src="${s}" onclick="if(confirm('Remove photo?')){R.items[${i}].imgs.splice(${j},1);render()}">`).join('')}</div>
<p><label class="b s" style="display:inline-block;margin:0">📷 Add photo<input type="file" accept="image/*" multiple hidden onchange="photo(${i},this)"></label> <button class="b s" onclick="R.items.splice(${i},1);render()">Remove</button></p></div>`).join('')}
${R.cid?`<div class="card"><label>Add machine</label><select onchange="addItem(this.value)"><option value="">Select machine…</option>${ms.map(m=>`<option value="${m.id}">${h(mname(m))}</option>`).join('')}</select>${ms.length?'':'<p class="m">No machines for this customer. Add them under Customers.</p>'}</div>`:''}
<div class="card"><h2>Suggestions</h2>${F('s1','1')}${F('s2','2')}${F('s3','3')}${F('tech','Technician')}${F('mgr','Manager')}${F('sign','Customer sign-off name')}<label>Status</label><select onchange="R.status=this.value">${['Completed','Pending'].map(s=>`<option ${s==R.status?'selected':''}>${s}</option>`).join('')}</select></div>
<button class="b" onclick="saveReport()">Save report</button> <button class="b s" onclick="go({p:'reports'})">Cancel</button>`}
function pick(id){R.cid=id;const c=cust(id);R.loc=c.location||'';R.contact=c.contact||'';R.mobile=c.mobile||'';R.items=[];render()}
function addItem(id){if(id){R.items.push({mid:id,status:'Working',tin:'',tout:'',desc:'',imgs:[]});render()}}
function photo(i,el){[...el.files].forEach(f=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);R.items[i].imgs.push(c.toDataURL('image/jpeg',.7));render()};im.src=URL.createObjectURL(f)})}
function saveReport(){if(!R.cid)return alert('Select a customer');if(!R.no){R.no='FSR-'+R.date.slice(0,4)+'-'+String(++DB.seq).padStart(4,'0')}
DB.set.tech=R.tech;DB.set.mgr=R.mgr;const i=DB.reports.findIndex(r=>r.id==R.id);i<0?DB.reports.push(R):DB.reports[i]=R;save();go({p:'report',id:R.id})}
function body(r){const c=cust(r.cid);return `<div class="lh"><img src="${LOGO}"><div><b>SERVICE REPORT</b> · ${h(r.no)}</div></div>
<table><tr><td>Customer</td><td><b>${h(c.name)}</b></td></tr><tr><td>Location</td><td>${h(r.loc)}</td></tr><tr><td>Contact</td><td>${h(r.contact)} ${h(r.mobile)}</td></tr><tr><td>Visit date</td><td>${h(r.date)}</td></tr><tr><td>Running hours</td><td>${h(r.hours)}</td></tr><tr><td>Status</td><td>${h(r.status)}</td></tr></table>
${r.items.map((it,i)=>`<h3>${i+1}. ${h(mname(mach(it.mid)))}</h3><div>${h(it.status)} · ${h(it.tin)}–${h(it.tout)}</div><p style="white-space:pre-wrap">${h(it.desc)}</p><div class="ph">${it.imgs.map(s=>`<img src="${s}" style="width:150px;height:150px">`).join('')}</div>`).join('')}
<h3>Suggestions</h3><ol>${[r.s1,r.s2,r.s3].filter(Boolean).map(s=>`<li>${h(s)}</li>`).join('')}</ol>
<table style="margin-top:30px"><tr><td>Technician<br><b>${h(r.tech)}</b></td><td>Manager<br><b>${h(r.mgr)}</b></td><td>Customer<br><b>${h(r.sign)}</b></td></tr></table>`}
function report(){const r=DB.reports.find(x=>x.id==V.id);return `<div class="np"><button class="b" onclick="window.print()">🖨 Print / PDF</button> <button class="b s" onclick="dlReport()">Save as HTML</button> <button class="b s" onclick="editReport('${r.id}')">Edit</button> <button class="b d" onclick="delReport()">Delete</button></div><div class="card" style="margin-top:10px">${body(r)}</div>`}
async function dlReport(){const r=DB.reports.find(x=>x.id==V.id);try{await dl(r.no+'.html',`<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>${r.no}</title><body style="font-family:sans-serif;max-width:760px;margin:auto">${body(r)}</body>`,'text/html')}catch(e){}}
function delReport(){if(confirm('Delete this report?')){DB.reports=DB.reports.filter(r=>r.id!=V.id);save();go({p:'reports'})}}
function settings(){return `<h2>Settings</h2><div class="card"><label>Default technician</label><input value="${h(DB.set.tech)}" oninput="DB.set.tech=this.value;save()"><label>Default manager</label><input value="${h(DB.set.mgr)}" oninput="DB.set.mgr=this.value;save()"></div>
<div class="card"><b>Backup</b><p class="m">Data (including photos) is stored only in this browser on this phone. Back up regularly.</p><button class="b" onclick="backup()">Download backup</button><p><label class="b s" style="display:inline-block">Restore backup<input type="file" accept=".json" hidden onchange="restore(this)"></label></p></div>`}
async function backup(){try{await dl('fairlink-backup-'+today()+'.json',JSON.stringify(DB),'application/json')}catch(e){}}
function restore(el){const f=el.files[0];if(!f||!confirm('Replace ALL current data with this backup?'))return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.customers||!o.reports)throw 0;DB=o;save();go({p:'home'})}catch(e){alert('Not a valid backup file')}})}
document.getElementById("hl").src=LOGO;load();
</script></body></html>
